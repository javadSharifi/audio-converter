[package]
name = "audio-converter"
version = "1.2.9"
description = "Video to audio converter"
edition = "2021"
rust-version = "1.77"

[lib]
name = "audio_converter"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "audio-converter"
path = "src/main.rs"

[[example]]
name = "export_types"
path = "examples/export_types.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
