name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            install-packages: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.install-packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 pkg-config

      - name: Install macOS FFmpeg build deps
        if: runner.os == 'macOS'
        run: brew install lame opus pkg-config

      - name: Install Windows UPX
        if: runner.os == 'Windows'
        run: choco install upx --no-progress

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch/bundle FFmpeg for this platform (LGPL)
        run: pnpm fetch:ffmpeg

      - name: Verify Rust-to-TypeScript type sync (Specta)
        run: |
          pnpm generate:types
          pnpm check:types

      - name: Run frontend unit tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app bundle
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-${{ matrix.label }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 pkg-config

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch/bundle FFmpeg binaries (host and Android)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          pnpm fetch:ffmpeg
          TARGET_TRIPLE=aarch64-linux-android pnpm fetch:ffmpeg

      - name: Verify Rust-to-TypeScript type sync
        run: |
          pnpm generate:types
          pnpm check:types

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          pnpm tauri android init
          # Apply Android icons to project
          if [ -d "src-tauri/icons/android" ]; then
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true
          fi
          # Ensure strings.xml has proper app name
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          cat << 'EOF' > src-tauri/gen/android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Audio Converter</string>
              <string name="main_activity_title">Audio Converter</string>
              <string name="default_notification_channel_id">audio_converter_notifications</string>
          </resources>
          EOF
          sed -i 's/<application/<application android:extractNativeLibs="true"/' src-tauri/gen/android/app/src/main/AndroidManifest.xml || true
          
          # Copy FFmpeg and FFprobe into jniLibs as lib*.so so Gradle packages them into lib/arm64-v8a/
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp -f src-tauri/binaries/ffmpeg-aarch64-linux-android src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp -f src-tauri/binaries/ffprobe-aarch64-linux-android src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libffprobe.so
          chmod 755 src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/lib*.so
          echo "=== jniLibs/arm64-v8a directory contents ==="
          ls -lh src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
          
          pnpm tauri android build --apk --target aarch64

          # Strictly inspect and verify the produced APK contents
          APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "=== Inspecting produced APK ($APK_FILE) ==="
          unzip -l "$APK_FILE" | grep "lib/"
          if ! unzip -l "$APK_FILE" | grep -q "lib/arm64-v8a/libffmpeg.so"; then
            echo "FATAL: lib/arm64-v8a/libffmpeg.so is missing from APK!"
            exit 1
          fi
          if ! unzip -l "$APK_FILE" | grep -q "lib/arm64-v8a/libffprobe.so"; then
            echo "FATAL: lib/arm64-v8a/libffprobe.so is missing from APK!"
            exit 1
          fi
          echo "SUCCESS: libffmpeg.so and libffprobe.so are verified inside APK!"

      - name: Sign Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          KS_PATH="$RUNNER_TEMP/release.keystore"
          KS_PASS="${KEYSTORE_PASSWORD:-audioconverter123}"
          K_ALIAS="${KEY_ALIAS:-audioconverter}"
          K_PASS="${KEY_PASSWORD:-audioconverter123}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          else
            echo "Generating release keystore in CI..."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=Audio Converter, OU=App, O=AudioConverter, L=Tehran, C=IR"
          fi

          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No unsigned APK found to sign."
            exit 0
          fi

          OUT_APK="$(dirname "$UNSIGNED_APK")/AudioConverter-android-arm64.apk"
          echo "Signing $UNSIGNED_APK -> $OUT_APK"

          "$APKSIGNER" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            "$UNSIGNED_APK"

          echo "Verifying signed APK signature:"
          "$APKSIGNER" verify --verbose "$OUT_APK"

          # Remove unsigned APK so only the signed release APK is uploaded
          rm -f "$UNSIGNED_APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-android-arm64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect installer files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.apk" \) -exec cp {} dist/ \;
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
